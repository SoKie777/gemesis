name: APK Android + EXE Windows

# Une étape terminée = fichier VERSION modifié : l'APK et l'EXE sont publiés dans les
# Releases du dépôt (tag vX.Y.Z) et dans la release fixe « derniere ».
# Lancement manuel possible depuis l'onglet Actions (fichiers alors dans les artefacts du run).
on:
  push:
    paths: ["VERSION"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Godot et les modèles d'export
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates/* "$tpl"/

      - name: Importer le projet et lancer les tests de simulation
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --script res://tests/run_tests.gd

      - name: Configurer la signature et le SDK Android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Clé FIXE (secret) : Android n'accepte une mise à jour que si l'APK est signé avec la même clé.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/gemesis.keystore"
            echo "KS_USER=gemesis" >> "$GITHUB_ENV"
            echo "KS_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_B64 absent : clé temporaire, mise à jour impossible sans désinstaller."
            keytool -genkeypair -v -keystore "$HOME/gemesis.keystore" -storepass android -alias gemesis \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Gemesis,O=Gemesis,C=FR"
            echo "KS_USER=gemesis" >> "$GITHUB_ENV"
            echo "KS_PASS=android" >> "$GITHUB_ENV"
          fi
          mkdir -p "$HOME/.config/godot"
          for v in 4 "$GODOT_VERSION"; do
          cat > "$HOME/.config/godot/editor_settings-${v}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          done

      - name: Numéroter la version
        run: |
          name="$(tr -d '[:space:]' < VERSION)"
          [[ "$GITHUB_EVENT_NAME" == "push" ]] || name="${name}-dev${GITHUB_RUN_NUMBER}"
          echo "APP_VERSION=${name}" >> "$GITHUB_ENV"
          sed -i "s/^version\/name=.*/version\/name=\"${name}\"/; s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" \
            export_presets.cfg

      - name: Exporter l'APK (release, plus rapide sur téléphone)
        run: |
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$HOME/gemesis.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KS_USER"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KS_PASS"
          mkdir -p build && touch build/.gdignore
          godot --headless --path . --export-release "Android" "$GITHUB_WORKSPACE/build/gemesis-${APP_VERSION}.apk"
          test -s "build/gemesis-${APP_VERSION}.apk"

      - name: Exporter l'EXE Windows
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" "$GITHUB_WORKSPACE/build/windows/Gemesis.exe"
          test -s build/windows/Gemesis.exe
          cd build/windows && zip -q "../gemesis-windows-${APP_VERSION}.zip" Gemesis.exe
          ls -la ..

      - uses: actions/upload-artifact@v4
        with:
          name: gemesis-${{ env.APP_VERSION }}
          path: |
            build/gemesis-${{ env.APP_VERSION }}.apk
            build/gemesis-windows-${{ env.APP_VERSION }}.zip

      - name: Publier la Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Gemesis v${{ env.APP_VERSION }}
          files: |
            build/gemesis-${{ env.APP_VERSION }}.apk
            build/gemesis-windows-${{ env.APP_VERSION }}.zip
          body: |
            Gemesis v${{ env.APP_VERSION }}
            - **Android** : télécharger le `.apk`, l'ouvrir, autoriser l'installation depuis cette source.
            - **PC (Windows)** : télécharger le `.zip`, l'extraire, lancer `Gemesis.exe`.

      - name: Release « derniere » (lien fixe)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "build/gemesis-${APP_VERSION}.apk" build/gemesis.apk
          cp "build/gemesis-windows-${APP_VERSION}.zip" build/gemesis-windows.zip
          gh release delete derniere --yes --cleanup-tag || true
          gh release create derniere build/gemesis.apk build/gemesis-windows.zip \
            --title "Dernière version (v${APP_VERSION})" \
            --notes "Toujours la dernière version. Compilé depuis ${GITHUB_SHA::7}." --latest
